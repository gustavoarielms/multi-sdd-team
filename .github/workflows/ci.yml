name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  C8_CONFIG: ""
  C8_REPORTER: ""
  DEBUG: ""
  ESLINT_FLAGS: ""
  NODE_OPTIONS: ""
  NODE_PATH: ""
  NODE_V8_COVERAGE: ""
  NYC_CONFIG: ""
  TIMING: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.14.0
          - 24.19.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Run the complete engineering profile on Node 22
        if: matrix.node-version == '22.14.0'
        run: env -u C8_CONFIG -u C8_REPORTER -u NODE_OPTIONS -u NODE_PATH -u NODE_V8_COVERAGE -u NYC_CONFIG -u TIMING -u DEBUG -u ESLINT_FLAGS node ./bin/sdd-codegraph.js run-gates . --comparison-base "$COMPARISON_BASE"
        env:
          COMPARISON_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  policy-and-package:
    name: Policy and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: npm ci
      - run: env -u C8_CONFIG -u C8_REPORTER -u NODE_OPTIONS -u NODE_PATH -u NODE_V8_COVERAGE -u NYC_CONFIG -u TIMING -u DEBUG -u ESLINT_FLAGS node ./bin/sdd-codegraph.js run-gates . --comparison-base "$COMPARISON_BASE"
        env:
          COMPARISON_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - name: Validate JSON and TOML
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          root = Path(".")
          json_files = sorted(path for path in root.rglob("*.json") if ".git" not in path.parts and "node_modules" not in path.parts)
          toml_files = sorted(path for path in root.rglob("*.toml") if ".git" not in path.parts and "node_modules" not in path.parts)
          for path in json_files:
              json.loads(path.read_text())
          for path in toml_files:
              tomllib.loads(path.read_text())
          print(f"Validated {len(json_files)} JSON and {len(toml_files)} TOML files.")
          PY
      - run: git diff --check
